name: Temporary Profiles launch QC

on:
  push:
    branches:
      - qc/profiles-launch-readiness
    paths:
      - '.github/workflows/tmp-profiles-launch-qc.yml'

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog tooling
        run: |
          python -m pip install --disable-pip-version-check polib deep-translator
          sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Complete and validate catalogs
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './languages/*' -not -path './.github/*' -not -path './tools/*' -print0 | xargs -0 xgettext --language=PHP --from-code=UTF-8 --keyword=__ --keyword=_e --keyword=esc_html__ --keyword=esc_html_e --keyword=esc_attr__ --keyword=esc_attr_e --keyword=_x:1,2c --keyword=_ex:1,2c --keyword=_n:1,2 --keyword=_nx:1,2,4c --sort-output --package-name='Core Blueprint Profiles' --package-version='1.0.0' -o languages/core-blueprint-profiles.pot
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-profiles-${locale}.po"
            msgmerge --quiet --update --backup=none "$po" languages/core-blueprint-profiles.pot
            msgattrib --no-obsolete -o "$po" "$po"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          import polib
          from deep_translator import GoogleTranslator
          from deep_translator.exceptions import TranslationNotFound

          locales = {'nl_NL':'nl','de_DE':'de','fr_FR':'fr','es_ES':'es','it_IT':'it','pt_PT':'pt'}
          token_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]|\{[A-Za-z0-9_.:-]+\}|<[^>]+>')
          printf_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]')
          brace_re = re.compile(r'\{[A-Za-z0-9_.:-]+\}')
          html_re = re.compile(r'<[^>]+>')

          def signature(value):
              return (printf_re.findall(value), brace_re.findall(value), html_re.findall(value))

          def translate_text(translator, value):
              if not value.strip():
                  return value
              try:
                  translated = translator.translate(value)
              except TranslationNotFound:
                  return value
              return translated or value

          def translate_preserving(translator, source):
              out = []
              pos = 0
              for match in token_re.finditer(source):
                  out.append(translate_text(translator, source[pos:match.start()]))
                  out.append(match.group(0))
                  pos = match.end()
              out.append(translate_text(translator, source[pos:]))
              result = ''.join(out)
              if signature(source) != signature(result):
                  raise SystemExit(f'token mismatch: {source!r}')
              return result

          for locale, target in locales.items():
              path = Path('languages') / f'core-blueprint-profiles-{locale}.po'
              po = polib.pofile(str(path))
              translator = GoogleTranslator(source='en', target=target)
              for entry in po:
                  if entry.obsolete:
                      continue
                  if entry.msgid_plural:
                      if not entry.msgstr_plural.get(0):
                          entry.msgstr_plural[0] = translate_preserving(translator, entry.msgid)
                      if not entry.msgstr_plural.get(1):
                          entry.msgstr_plural[1] = translate_preserving(translator, entry.msgid_plural)
                  elif not entry.msgstr:
                      entry.msgstr = translate_preserving(translator, entry.msgid)
              po.metadata['Project-Id-Version'] = 'Core Blueprint Profiles 1.0.0'
              po.metadata['PO-Revision-Date'] = '2026-09-03 00:00+0000'
              po.metadata['Last-Translator'] = 'Core Blueprint'
              po.metadata['Language-Team'] = locale
              po.metadata['MIME-Version'] = '1.0'
              po.save(str(path))
          PY
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-profiles-${locale}.po"
            mo="languages/core-blueprint-profiles-${locale}.mo"
            msgfmt --check --check-format -o "$mo" "$po"
            missing=$(msgattrib --untranslated "$po" | grep -c '^msgid ' || true)
            echo "${locale}_UNTRANSLATED=${missing}"
            test "$missing" -eq 0
          done
      - name: Recheck contracts
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './tools/*' -print0 | xargs -0 -n1 php -l >/tmp/profiles-php-lint.log
          grep -q 'CB_PROFILES_REQUIRED_API' core-blueprint-profiles.php
          grep -q 'ExtensionRegistry::register' src/Integration/CoreBlueprint.php
          test ! -e src/Admin/FallbackPage.php
      - name: Commit catalogs
        shell: bash
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git add languages/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Complete Profiles launch translation catalogs'
            git push origin HEAD:qc/profiles-launch-readiness
          fi
